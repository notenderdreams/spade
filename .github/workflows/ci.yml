name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Check dependency files
        run: |
          go mod tidy -diff
          go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Smoke test
        run: sh test/smoke.sh
      - name: Test standalone installer
        run: python3 test/installer_test.py

  package:
    name: Validate release packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.20.2
          args: check
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.20.2
          args: release --snapshot --clean
      - name: Validate Homebrew formula generation
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          stable_version="${version%%-*}"
          sed "s/${version}/${stable_version}/g" "dist/spade_${version}_checksums.txt" > dist/homebrew-checksums.txt
          python3 scripts/generate-homebrew.py --version "$stable_version" --checksums dist/homebrew-checksums.txt --output dist/spade.rb
          ruby -c dist/spade.rb
      - name: Smoke test packaged Linux binary
        run: |
          mkdir -p dist/smoke
          version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          tar -xzf "dist/spade_${version}_linux_amd64.tar.gz" -C dist/smoke
          SPADE_TEST_BIN="$PWD/dist/smoke/spd" SPADE_TEST_VERSION="$version" sh test/smoke.sh
