version: 2
project_name: spade

builds:
  - id: spd
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: spd
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - -s -w -X spd/cmd.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - sh scripts/sign-macos.sh "{{ .Os }}" "{{ .Path }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - docs/SHELL_COMPLETION.md
      - docs/RELEASING.md
      - docs/releases/*.md
      - docs/assets/banner.png

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: notenderdreams
    name: spade
  name_template: "Spade v{{ .Version }}"
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
